<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhoneBook</title>
</head>

<body style="margin:0;padding:0;background:#f4f4f4;font-family:Arial,Helvetica,sans-serif;">

    <table width="100%" cellpadding="20" cellspacing="0" style="background:#f4f4f4;">
        <tr>
            <td align="center">

                <table width="600" cellpadding="0" cellspacing="0"
                       style="background:#ffffff;border-radius:8px;overflow:hidden;">


                    <tr>
                        <td align="center"
                            style="background:#2563eb;color:#ffffff;padding:25px;">

                            <h1 style="margin:0;">📱 PhoneBook</h1>

                        </td>
                    </tr>


                    <tr>
                        <td style="padding:35px;">

                            <h2 style="margin-top:0;">
                                Hello {{Name}},
                            </h2>

                            <p>
                                You have received a new message from <strong>PhoneBook</strong>.
                            </p>

                            <div style="
                                margin:25px 0;
                                padding:20px;
                                background:#f8f9fa;
                                border-left:4px solid #2563eb;
                                white-space:pre-wrap;
                                line-height:1.6;">
                                {{Message}}
                            </div>

                            <p>
                                Best regards,<br>
                                <strong>PhoneBook Team</strong>
                            </p>

                        </td>
                    </tr>


                    <tr>
                        <td align="center"
                            style="background:#f8f8f8;padding:20px;color:#777777;font-size:12px;">

                            This email was sent from PhoneBook.<br>
                            PhoneBook © 2026

                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>
</html>
