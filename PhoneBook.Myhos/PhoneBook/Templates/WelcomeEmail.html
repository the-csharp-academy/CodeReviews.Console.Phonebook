<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style='margin:0;padding:0;background-color:#f4f4f4;font-family:Arial,sans-serif;'>

    <table width='100%' cellpadding='20' cellspacing='0' style='background-color:#f4f4f4;'>
        <tr>
            <td align='center'>

                <table width='600' cellpadding='30' cellspacing='0'
                       style='background-color:white;border-radius:8px;'>

                    <tr>
                        <td align='center'
                            style='background-color:#2563eb;color:white;padding:20px;'>

                            <h1 style='margin:0;'>📱 PhoneBook</h1>

                        </td>
                    </tr>

                    <tr>
                        <td>

                            <h2>Hello {{Name}}!</h2>

                            <p>
                                Your contact has been created successfully.
                            </p>

                            <table cellpadding='8' cellspacing='0' style='margin-top:20px;'>

                                <tr>
                                    <td><strong>Name:</strong></td>
                                    <td>{{Name}}</td>
                                </tr>

                                <tr>
                                    <td><strong>Phone:</strong></td>
                                    <td>{{Phone}}</td>
                                </tr>

                                <tr>
                                    <td><strong>Email:</strong></td>
                                    <td>{{Email}}</td>
                                </tr>

                            </table>

                            <p style='margin-top:30px;'>
                                Thank you for using <strong>PhoneBook</strong>.
                            </p>

                        </td>
                    </tr>

                    <tr>
                        <td align='center'
                            style='background:#f8f8f8;color:#666;padding:15px;font-size:12px;'>

                            PhoneBook © 2026

                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>
</body>
</html>
